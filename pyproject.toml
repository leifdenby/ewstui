[project]
name = "ewstui"
version = "0.1.0"
description = "A terminal (TUI) email + calendar client for Microsoft Exchange, talking EWS directly"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leif Denby" }]
keywords = ["exchange", "ews", "email", "calendar", "tui", "terminal", "outlook", "vim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Communications :: Email :: Email Clients (MUA)",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "exchangelib>=5.0",
    "textual>=0.60",
    # Needed for --auth oauth2 / auto (the default)
    "msal>=1.28",
    "keyring>=25.7.0",
    "pyobjc-framework-localauthentication>=12.2.2 ; sys_platform == 'darwin'",
    "tomlkit>=0.15.1",
    "markdown-it-py[linkify]>=3.0",
    "markdownify>=0.13",
]

[project.optional-dependencies]
# --auth kerberos also needs a system Kerberos install (libkrb5-dev on
# Debian/Ubuntu, krb5-devel on Fedora/RHEL) plus a valid ticket via `kinit`
kerberos = ["requests-gssapi>=1.2"]

[project.urls]
Homepage = "https://github.com/leifdenby/ewstui"
Repository = "https://github.com/leifdenby/ewstui"
Issues = "https://github.com/leifdenby/ewstui/issues"
Changelog = "https://github.com/leifdenby/ewstui/blob/main/CHANGELOG.md"

[project.scripts]
ewstui = "ewstui.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: PEP 639 license / license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The demo GIF (~0.8 MB) and dev scripts aren't needed to build or run it.
exclude = ["docs/", "scripts/", ".github/"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
